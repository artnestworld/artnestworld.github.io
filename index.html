<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(36px, 7vw, 64px);
            letter-spacing: -2px;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
        }

        .line {
            width: 50px;
            height: 4px;
            background: #111;
            margin: 30px auto;
            border-radius: 10px;
        }

        .small {
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">🚧</div>

        <h1>Under Construction</h1>

        <p>
            Something new is being built here.<br>
            We'll be online soon.
        </p>

        <div class="line"></div>

        <p class="small">
            © 2026 ArtNestWorld.com
        </p>

    </main>

</body>
</html>
